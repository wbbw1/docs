      allOf:
        - $ref: '#/components/schemas/AutomationStep'
    AutomationThrottleStep:
      title: AutomationThrottleStep
      type: object
      properties:
        action:
          type: string
          enum:
            - throttle
        max_allowed:
          type: integer
          description: Maximum number of allowed notifications in that timeframe
          example: 1
        period:
          type: string
          description: >-
            Defines the throttle period which corresponds to the max_allowed.
            Specified as an ISO 8601 duration,
            https://en.wikipedia.org/wiki/ISO_8601#Durations
          example: PT5M
        scope:
          $ref: '#/components/schemas/AutomationThrottleScope'
        throttle_key:
          type: string
          nullable: true
          description: >-
            If using scope=dynamic, provide the reference (e.g.,
            refs.data.throttle_key) to the how the throttle should be identified
        should_alert:
          type: boolean
          description: Value must be true
          example: false
        on_throttle:
          $ref: '#/components/schemas/AutomationThrottleOnThrottle'
      required:
        - action
        - max_allowed
        - period
        - scope
        - should_alert
        - on_throttle
      allOf:
