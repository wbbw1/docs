components:
  schemas:
    SendMessageResponse:
      title: SendMessageResponse
      type: object
      properties:
        requestId:
          type: string
          description: >-
            A successful call to `POST /send` returns a `202` status code along
            with a `requestId` in the response body.


            For send requests that have a single recipient, the `requestId` is
            assigned to the derived message as its message_id. Therefore the
            `requestId` can be supplied to the Message's API for single
            recipient messages.


            For send requests that have multiple recipients (accounts,
            audiences, lists, etc.), Courier assigns a unique id to each derived
            message as its `message_id`. Therefore the `requestId` cannot be
            supplied to the Message's API for single-recipient messages.
      required:
        - requestId
    Filter:
      title: Filter
      oneOf:
        - $ref: '#/components/schemas/SingleFilterConfig'
        - $ref: '#/components/schemas/NestedFilterConfig'
    Operator:
      title: Operator
      oneOf:
        - $ref: '#/components/schemas/ComparisonOperator'
        - $ref: '#/components/schemas/LogicalOperator'
    BaseFilterConfig:
      title: BaseFilterConfig
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/Operator'
          description: The operator to use for filtering
      required:
        - operator
    FilterConfig:
      title: FilterConfig
      oneOf:
        - $ref: '#/components/schemas/SingleFilterConfig'
        - $ref: '#/components/schemas/NestedFilterConfig'
    SingleFilterConfig:
      title: SingleFilterConfig
      type: object
      description: A single filter to use for filtering
      properties:
        value:
          type: string
          description: The value to use for filtering
        path:
          type: string
          description: >-
            The attribe name from profile whose value will be operated against
            the filter value
      required:
        - value
        - path
      allOf:
        - $ref: '#/components/schemas/BaseFilterConfig'
    NestedFilterConfig:
      title: NestedFilterConfig
      type: object
      description: The operator to use for filtering
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/FilterConfig'
      required:
        - rules
      allOf:
        - $ref: '#/components/schemas/BaseFilterConfig'
    ComparisonOperator:
      title: ComparisonOperator
      type: string
      enum:
        - ENDS_WITH
        - EQ
        - EXISTS
        - GT
        - GTE
        - INCLUDES
        - IS_AFTER
        - IS_BEFORE
        - LT
        - LTE
        - NEQ
        - OMIT
        - STARTS_WITH
    LogicalOperator:
      title: LogicalOperator
      type: string
      enum:
        - AND
        - OR
    Audience:
      title: Audience
      type: object
      properties:
        id:
          type: string
          description: A unique identifier representing the audience_id
        name:
          type: string
          description: The name of the audience
        description:
          type: string
          description: A description of the audience
        filter:
          $ref: '#/components/schemas/Filter'
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - name
        - description
        - filter
        - created_at
        - updated_at
    AudienceMember:
      title: AudienceMember
      type: object
      properties:
        added_at:
          type: string
        audience_id:
          type: string
        audience_version:
          type: integer
        member_id:
          type: string
        reason:
          type: string
      required:
        - added_at
        - audience_id
        - audience_version
        - member_id
        - reason
    AudienceListResponse:
      title: AudienceListResponse
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Audience'
        paging:
          $ref: '#/components/schemas/Paging'
      required:
        - items
        - paging
    AudienceMemberGetResponse:
      title: AudienceMemberGetResponse
      type: object
      properties:
        audienceMember:
          $ref: '#/components/schemas/AudienceMember'
      required:
        - audienceMember
    AudienceMemberListResponse:
      title: AudienceMemberListResponse
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AudienceMember'
        paging:
          $ref: '#/components/schemas/Paging'
      required:
        - items
        - paging
    AudienceUpdateResponse:
      title: AudienceUpdateResponse
      type: object
      properties:
        audience:
          $ref: '#/components/schemas/Audience'
      required:
        - audience
    ListAuditEventsParams:
      title: ListAuditEventsParams
      type: object
      properties:
        cursor:
          type: string
          nullable: true
    GetAuditEventParams:
      title: GetAuditEventParams
      type: object
      properties:
        auditEventId:
          type: string
      required:
        - auditEventId
    ListAuditEventsResponse:
      title: ListAuditEventsResponse
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
      required:
