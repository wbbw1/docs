        id:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    Target:
      title: Target
      type: object
      properties:
        id:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    AuditEvent:
      title: AuditEvent
      type: object
      properties:
