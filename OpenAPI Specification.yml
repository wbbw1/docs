        - source
        - timestamp
        - type
    IssueTokenResponse:
      title: IssueTokenResponse
      type: object
      properties:
        token:
          type: string
          nullable: true
    CourierScope:
      title: CourierScope
      type: string
      enum:
        - read:preferences
        - write:preferences
        - read:user-tokens
        - write:user-tokens
        - read:brands
        - write:brands
        - read:brands{:id}
        - write:brands{:id}
        - write:track
        - inbox:read:messages
        - inbox:write:messages
        - inbox:write:event
        - inbox:write:events
        - user_id:$YOUR_USER_ID
    AccessorType:
      title: AccessorType
      type: object
      properties:
        $ref:
          type: string
      required:
        - $ref
    MergeAlgorithm:
      title: MergeAlgorithm
      type: string
      enum:
        - replace
        - none
        - overwrite
        - soft-merge
    AutomationRunContext:
      title: AutomationRunContext
      type: object
      properties:
        brand:
          type: string
          nullable: true
        data:
          nullable: true
        profile:
          $ref: '#/components/schemas/Profile'
          nullable: true
        template:
          type: string
          nullable: true
        recipient:
          type: string
          nullable: true
    AutomationStep:
      title: AutomationStep
      type: object
      properties:
        if:
          type: string
          nullable: true
        ref:
          type: string
          nullable: true
    AutomationAddToBatchScope:
      title: AutomationAddToBatchScope
      type: string
      enum:
        - user
        - global
        - dynamic
    AutomationAddToBatchStep:
      title: AutomationAddToBatchStep
      type: object
      properties:
        action:
          type: string
          enum:
            - add-to-batch
        wait_period:
          type: string
          description: >-
            Defines the period of inactivity before the batch is released.
            Specified as an [ISO 8601
            duration](https://en.wikipedia.org/wiki/ISO_8601#Durations)
          example: PT5M
        max_wait_period:
          type: string
          description: >-
            Defines the maximum wait time before the batch should be released.
            Must be less than wait period. Maximum of 60 days. Specified as an
            [ISO 8601
            duration](https://en.wikipedia.org/wiki/ISO_8601#Durations)
          example: PT1H
        max_items:
          $ref: '#/components/schemas/AutomationAddToBatchMaxItemsType'
          nullable: true
          description: >-
            If specified, the batch will release as soon as this number is
            reached
        retain:
          $ref: '#/components/schemas/AutomationAddToBatchRetain'
        scope:
          $ref: '#/components/schemas/AutomationAddToBatchScope'
          nullable: true
          description: >-
            Determine the scope of the batching. If user, chosen in this order:
            recipient, profile.user_id, data.user_id, data.userId.

            If dynamic, then specify where the batch_key or a reference to the
            batch_key
        batch_key:
          type: string
          nullable: true
          description: >-
            If using scope=dynamic, provide the key or a reference (e.g.,
            refs.data.batch_key)
        batch_id:
          type: string
          nullable: true
        category_key:
          type: string
          nullable: true
          description: >-
            Defines the field of the data object the batch is set to when
            complete. Defaults to `batch`
      required:
        - action
        - wait_period
        - max_wait_period
        - retain
      allOf:
        - $ref: '#/components/schemas/AutomationStep'
    AutomationAddToBatchMaxItemsType:
      title: AutomationAddToBatchMaxItemsType
      oneOf:
        - type: string
        - type: integer
    AutomationAddToBatchRetainType:
      title: AutomationAddToBatchRetainType
      type: string
      enum:
        - first
        - last
        - highest
        - lowest
    AutomationFetchDataWebhookMethod:
      title: AutomationFetchDataWebhookMethod
      type: string
      enum:
        - GET
        - POST
    AutomationFetchDataWebhook:
      title: AutomationFetchDataWebhook
      type: object
      properties:
        body:
          type: object
          additionalProperties: true
          nullable: true
        headers:
          type: object
          additionalProperties: true
          nullable: true
        params:
          type: object
          additionalProperties: true
          nullable: true
        method:
          $ref: '#/components/schemas/AutomationFetchDataWebhookMethod'
        url:
          type: string
      required:
        - method
        - url
    AutomationThrottleScope:
      title: AutomationThrottleScope
      type: string
      enum:
        - user
        - global
        - dynamic
    AutomationThrottleOnThrottle:
      title: AutomationThrottleOnThrottle
      type: object
      properties:
        $node_id:
          type: string
          description: The node to go to if the request is throttled
      required:
        - $node_id
    AutomationAddToBatchRetain:
      title: AutomationAddToBatchRetain
      type: object
      description: >-
        Defines what items should be retained and passed along to the next steps
        when the batch is released
      properties:
        type:
          $ref: '#/components/schemas/AutomationAddToBatchRetainType'
          description: >-
            Keep N number of notifications based on the type. First/Last N based
            on notification received.

            highest/lowest based on a scoring key providing in the data accessed
            by sort_key
        count:
          type: integer
          description: >-
            The number of records to keep in batch. Default is 10 and only
            configurable by requesting from support.

            When configurable minimum is 2 and maximum is 100.
          example: 10
        sort_key:
          type: string
          nullable: true
          description: >-
            Defines the data value data[sort_key] that is used to sort the
            stored items. Required when type is set to highest or lowest.
      required:
        - type
        - count
    AutomationAddToDigestStep:
      title: AutomationAddToDigestStep
      type: object
      properties:
        action:
          type: string
          enum:
            - add-to-digest
        subscription_topic_id:
          type: string
          description: The subscription topic that has digests enabled
          example: RAJE97CMT04KDJJ88ZDS2TP1690S
      required:
        - action
        - subscription_topic_id
      allOf:
        - $ref: '#/components/schemas/AutomationStep'
    AutomationCancelStep:
